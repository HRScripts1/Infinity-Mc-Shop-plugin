
name: Build HR Shop

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B clean package

      - name: Upload HR Shop JAR
        uses: actions/upload-artifact@v4
        with:
          name: HR-Shop-26.2
          path: target/*.jar
