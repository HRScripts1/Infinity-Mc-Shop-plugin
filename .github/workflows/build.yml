
name: Build HR Shop

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Find Maven project
        id: project
        shell: bash
        run: |
          POM=$(find . -name pom.xml -not -path '*/.git/*' -print -quit)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml was not found!"
            echo "Upload the complete Maven project."
            exit 1
          fi

          echo "Found Maven project: $POM"
          echo "pom=$POM" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: mvn -B -f "${{ steps.project.outputs.pom }}" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HR-Shop-26.2
          path: '**/target/*.jar'
          if-no-files-found: error
